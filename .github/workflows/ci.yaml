name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ['3.13']

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y gcc libpq-dev
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install black isort flake8 bandit safety
      - name: Lint Python code
        run: |
          black --check backend
          isort --check-only backend
          flake8 backend
      - name: Security and dependency checks
        run: |
          bandit -r backend -lll
          safety check --full-report
      - name: Django static checks
        run: |
          cd backend
          python -m compileall .
          python manage.py check
          python manage.py check --deploy
          python manage.py makemigrations --check
      - name: Run tests
        run: |
          cd backend
          pytest
      - name: Docker compose validation
        run: |
          cd backend
          docker compose -f docker-compose.prod.yml config
      - name: Docker image build
        run: |
          cd backend
          docker build -t meims-backend:ci .
